id: short_chat_control
title: Short chat control response
category: short_chat
goal: Confirm the harness can complete a short control exchange cleanly.
tags: [chat, control, correctness]
profile:
  provider: llamacpp
  model: qwen3.6-27b
  harness_profile: default
setup:
  context_window: 32768
turns:
  - role: user
    content: "Reply with exactly: SHORT-CONTROL-17"
checks:
  rules:
    - type: status_is
      value: succeeded
    - type: final_text_contains
      value: SHORT-CONTROL-17
