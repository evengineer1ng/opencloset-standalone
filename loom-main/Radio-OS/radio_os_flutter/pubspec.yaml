name: radio_os_flutter
description: Radio OS — Native Flutter client for Raspberry Pi 5 radio unit.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.0

  # Routing
  go_router: ^14.0.0

  # HTTP & WebSocket
  dio: ^5.4.0
  web_socket_channel: ^2.4.0

  # Audio
  just_audio: ^0.9.36

  # UI
  fl_chart: ^0.68.0
  cached_network_image: ^3.3.0
  google_fonts: ^6.1.0

  # Utilities
  shared_preferences: ^2.2.0
  path_provider: ^2.1.0
  intl: ^0.19.0
  collection: ^1.18.0
  json_annotation: ^4.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  # Uncomment after placing JetBrainsMono .ttf files in assets/fonts/
  # fonts:
  #   - family: JetBrainsMono
  #     fonts:
  #       - asset: assets/fonts/JetBrainsMono-Regular.ttf
  #       - asset: assets/fonts/JetBrainsMono-Bold.ttf
  #         weight: 700
