[platformio]
default_envs = s3_audio_board

; ─── ESP32-S3 Audio Board (Waveshare ESP32-S3-AUDIO-Board) ──────────────────
; ES8311 DAC/amp + ES7210 mic ADC, both on I2C(10,11) + I2S(12,13,14,15,16)
[env:s3_audio_board]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_port = /dev/cu.usbmodem1101
monitor_port = /dev/cu.usbmodem1101
build_flags =
    -DBOARD_S3_AUDIO
    -DNODE_ID=1
    -DARDUINO_USB_CDC_ON_BOOT=1   ; route Serial to USB CDC
lib_deps =
    links2004/WebSockets@^2.4.1
    madhephaestus/ESP32Servo@^3.0.5

; ─── ESP32-C6 (Waveshare DEV-KIT-N8) ───────────────────────────────────────
[env:c6_node]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
upload_port = /dev/cu.wchusbserial58CD0058151
monitor_port = /dev/cu.wchusbserial58CD0058151
build_flags =
    -DBOARD_C6
    -DNODE_ID=1          ; change to 2 for second C6

; ─── Standalone beep test (no WiFi, no WebSocket) ──────────────────────────
[env:beep_test]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_port = /dev/cu.usbmodem2101
monitor_port = /dev/cu.usbmodem2101
build_src_filter = -<*> +<../beep_test/>
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =

; ─── Classic ESP32 DevKit C ─────────────────────────────────────────────────
[env:esp32_node]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -DBOARD_ESP32
    -DNODE_ID=3

; ─── Shared settings ────────────────────────────────────────────────────────
[env]
lib_deps =
    links2004/WebSockets@^2.4.1
